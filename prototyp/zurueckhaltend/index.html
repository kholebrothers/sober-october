<!doctype html>
<!-- PROTOTYP, zum Wegwerfen. Siehe NOTIZ.md. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sober October · Prototyp</title>
<link rel="stylesheet" href="geliehen/knopf.css">
<link rel="stylesheet" href="geliehen/hero.css">
<style>
/* Palette aus mahlzeit/docs/GESTALT.md (über smokefree/index.html). Kein Rot. */
:root {
  --paper:#F5F1E8; --surface:#FFFDF7; --ink:#20231F; --leise:#6E7263;
  --moss:#6E7762; --clay:#A66E55; --mist:#C8CFCD; --teal:#315D60;
  --linie:#E2DDD0; --linie-stark:#CFC8B7;
  --serif:"Source Serif 4", Georgia, serif;
  --sans:Inter, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 var(--sans); }
#buehne { max-width:440px; margin:0 auto; padding:28px 18px 120px; min-height:100vh; }
h1 { font-weight:500; font-size:24px; line-height:1.25; margin:4px 0 18px; }
h2 { font:500 21px/1.3 var(--serif); margin:2px 0 6px; }
.serif { font-family:var(--serif); }
.leise { color:var(--leise); }
.bogen-rubrik { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--leise); margin:0; }
button { font:inherit; color:inherit; cursor:pointer; }
button.text { background:none; border:0; padding:4px 0; color:var(--teal); text-align:left; }
button.text:disabled { color:var(--leise); cursor:default; font-size:13px; }
button.gross { background:var(--ink); color:var(--paper); border:0; border-radius:12px; padding:12px 18px; }
button.gross.leise { background:transparent; color:var(--ink); border:1px solid var(--linie-stark); }
button.gross:disabled { opacity:.3; cursor:default; }
button.rund { width:36px; height:36px; border-radius:50%; border:1px solid var(--linie-stark); background:transparent; color:var(--leise); }

/* Der offene Kreis: leer = unbekannt. */
.kreis { display:inline-block; width:28px; height:28px; flex:none; border-radius:50%; border:1.5px solid var(--mist); position:relative; }
.kreis[data-ohne] { border-color:var(--moss); }
.kreis[data-ohne]::after { content:"✓"; position:absolute; inset:0; display:grid; place-items:center; font-size:13px; color:var(--moss); }
.kreis[data-spur]::before { content:""; position:absolute; right:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; background:var(--clay); }
/* Ein Drang ist kein Konsum: der Kreis wird gestrichelt, nicht markiert. */
.kreis[data-drang] { border-style:dashed; border-color:var(--teal); }
.kreis.klein { width:18px; height:18px; }
.kreis.klein[data-ohne]::after { font-size:10px; }
.kreis[data-heute] { box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--linie-stark); }

/* Wahl */
.wahl h1 { margin-bottom:4px; }
.wahl-zeile { border:1px solid var(--linie); border-radius:14px; margin:12px 0; background:var(--surface); }
.wahl-zeile[data-an="true"] { border-color:var(--moss); }
.wahl-knopf { width:100%; text-align:left; background:none; border:0; padding:16px; font:500 18px var(--serif); }
.wahl-zusatz { display:block; padding:0 16px 14px; font-size:13px; }
.wahl > .gross { margin-top:14px; width:100%; }

/* Bogen */
dialog#bogen { border:0; border-radius:18px; padding:0; width:min(420px, calc(100vw - 24px)); background:var(--surface); color:var(--ink); box-shadow:0 20px 60px -20px #0004; }
dialog#bogen::backdrop { background:#20231F33; }
.bogen-inhalt { padding:22px 20px 18px; display:grid; gap:12px; }
.wahlreihe { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.frage { display:grid; gap:6px; }
.frage input:not([type]) , .frage input[name] { font:inherit; padding:9px 11px; border:1px solid var(--linie-stark); border-radius:10px; background:var(--paper); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip input { position:absolute; opacity:0; }
.chip span { display:inline-block; padding:5px 11px; border:1px solid var(--linie-stark); border-radius:99px; font-size:13px; }
.chip input:checked + span { border-color:var(--teal); color:var(--teal); background:#315D6010; }
.begleitung { text-align:center; justify-items:center; }
.welle { width:140px; height:140px; border-radius:50%; border:1.5px solid var(--mist); margin:10px; animation:atmen 9s ease-in-out infinite; }
@keyframes atmen { 0%,100% { transform:scale(.72); border-color:var(--mist); } 50% { transform:scale(1); border-color:var(--moss); } }
.uhr { font-variant-numeric:tabular-nums; margin:0; }
.ebene p { margin:0 0 10px; font-family:var(--serif); }
.ebene .leise { font-family:var(--sans); font-size:13px; }
.zitat.wahl { font-family:var(--sans); font-style:normal; font-size:13px; color:var(--leise); }
.zitat { display:block; font-family:var(--serif); font-style:italic; color:var(--ink); }
.monat { display:grid; grid-template-columns:repeat(7, 18px); gap:10px; margin:6px 0 14px; }
.ebene .kur-hero { --flame:var(--moss); --sage:var(--teal); }

/* Variante A */
.va-zeile { display:grid; grid-template-columns:28px 1fr auto; gap:14px; align-items:start; padding:16px 0; border-top:1px solid var(--linie); }
.va-zeile strong { font:500 17px var(--serif); }
.va-liste { list-style:none; margin:2px 0 0; padding:0; font-size:13px; color:var(--leise); }
.va-aktionen { display:grid; justify-items:end; gap:0; font-size:14px; }
.va-mehr { margin-top:40px; border-top:1px solid var(--linie); padding-top:12px; }
.va-mehr summary { color:var(--leise); cursor:pointer; font-size:14px; }
.va-ebene { display:grid; padding:10px 0 4px; }
.va-ebene[data-stand="zu"] .va-titel { color:var(--mist); }
.va-titel { font-family:var(--serif); }
.punkt { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); vertical-align:middle; }

/* Variante B */
.vb { display:grid; gap:18px; justify-items:center; }
.vb-oben { width:100%; display:flex; justify-content:space-between; align-items:center; min-height:20px; }
.vb-punkte { display:flex; gap:8px; }
.vb-punkt { width:12px; height:12px; border-radius:50%; border:1.5px solid var(--teal); background:transparent; padding:0; }
.vb-punkt[data-neu="true"] { background:var(--teal); }
.vb-reiter { display:flex; gap:18px; }
.vb-reiter .text { color:var(--leise); }
.vb-reiter .text[data-an="true"] { color:var(--ink); border-bottom:1.5px solid var(--ink); }
.vb .zk { width:100%; --zk-hoehe:260px; --zk-grund:var(--surface); }
.vb-drang { width:100%; padding:16px; border:1px dashed var(--linie-stark); border-radius:16px; background:transparent; font:17px var(--serif); }
.vb-plus { margin-top:30px; display:grid; justify-items:center; gap:4px; }

/* Variante C */
.vc h1 { font-size:27px; margin-bottom:0; }
.vc-tag { font:italic 18px var(--serif); color:var(--leise); margin:2px 0 22px; }
.vc-verben p { margin:4px 0; }
.vc-verb { font-family:var(--serif); font-size:16px; text-decoration:underline; text-decoration-color:var(--linie-stark); text-underline-offset:3px; }
.vc-faden { list-style:none; padding:0; margin:30px 0 0; border-left:1px solid var(--linie); }
.vc-faden li { padding:6px 0 6px 16px; }
.vc-kopf { padding-top:18px !important; }
.vc-spur, .vc-angebot, .vc-an { border-left:2px solid var(--teal); margin-left:-1.5px; }

/* Prototyp-Leiste — gehört nicht zum Design. */
#leiste { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:4px; align-items:center; background:#111; color:#fff; border-radius:99px; padding:5px 8px; font:12px/1 ui-monospace, Menlo, monospace; box-shadow:0 6px 20px #0005; z-index:10; white-space:nowrap; }
#leiste button { background:none; border:0; color:#fff; padding:6px 8px; border-radius:99px; font:inherit; }
#leiste button:hover { background:#333; }
#vname { padding:0 6px; min-width:84px; text-align:center; }
#zustand { position:fixed; right:10px; bottom:64px; width:min(360px, 90vw); max-height:60vh; overflow:auto; background:#111; color:#9f9; font:11px/1.35 ui-monospace, Menlo, monospace; padding:10px; border-radius:10px; margin:0; z-index:10; }
#meldung { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px; font-size:14px; max-width:90vw; z-index:20; }
</style>
</head>
<body>
<main id="buehne"></main>
<dialog id="bogen"></dialog>
<p id="meldung" hidden></p>
<pre id="zustand" hidden></pre>
<nav id="leiste" aria-label="Prototyp">
  <button id="zurueck" title="vorige Variante (←)">◀</button>
  <span id="vname"></span>
  <button id="vor" title="nächste Variante (→)">▶</button>
  <span style="opacity:.3">|</span>
  <button id="tag" title="einen Tag weiter">Tag +1</button>
  <button id="zeige" title="Zustand zeigen">Zustand</button>
  <button id="neu" title="von vorn">↺</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
