# Testen und ausliefern, bei jedem Push:
#   main           → live:     https://sober-october.khole.workers.dev
#   jeder Branch   → Vorschau: https://<branch>-sober-october.khole.workers.dev
#
# Eine Vorschau ist eine hochgeladene Worker-Version, die nicht live geschaltet wird
# (wrangler versions upload --preview-alias). Sie bekommt die Dev-Uhr (public/kern/uhr.js),
# live nicht. Gibt es zum Branch einen offenen PR, steht die Adresse dort als Kommentar.
# Scheitern die Tests, wird nichts hochgeladen.
#
# Braucht das Repo-Secret CLOUDFLARE_API_TOKEN (Konto z3e, Rechte: Workers Scripts:Edit,
# Account Settings:Read, User Details:Read). Einrichten: README, Abschnitt „Ausliefern".
name: Ausliefern
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ausliefern-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ausliefern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Live
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --message "${GITHUB_SHA::7} main"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Vorschau
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Der Alias wird Teil eines Hostnamens: klein, nur a-z, 0-9 und Bindestrich,
          # mit einem Buchstaben vorn, und kurz genug für "<alias>-sober-october" (≤ 63).
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          case "$alias" in [a-z]*) ;; *) alias="b-$alias" ;; esac
          npx wrangler versions upload --preview-alias "$alias" --message "${GITHUB_SHA::7} $BRANCH"
          url="https://$alias-sober-october.khole.workers.dev"
          echo "Vorschau: $url" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --edit-last --create-if-none \
              --body "Vorschau für \`${GITHUB_SHA::7}\`: $url (mit Dev-Uhr unten links)"
          fi
